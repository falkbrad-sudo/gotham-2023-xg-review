[tool.pytest.ini_options]
markers = [
    "integration: requires network access to StatsBomb's open data (deselect with -m 'not integration')",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore:credentials were not supplied. open data access only:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
